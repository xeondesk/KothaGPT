model:
  architecture: decoder_transformer
  vocab_size: 50000
  hidden_size: 768
  num_layers: 12
  num_heads: 12
  max_position_embeddings: 4096

training:
  batch_size: 2
  gradient_accumulation_steps: 16
  learning_rate: 3.0e-4
  max_steps: 1000
  mixed_precision: bf16

data:
  train: data/processed/train
  validation: data/processed/validation
