services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
      POSTGRES_DB: ai
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  api:
    build: ./services/api
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [postgres, redis, qdrant]

  trainer:
    profiles: [gpu]
    build: ./services/api
    working_dir: /workspace
    command: ["python", "-m", "ml.gpu_verify"]
    volumes:
      - ./data/tokenized:/workspace/data/tokenized:ro
      - ./ml/pretrain/artifacts:/workspace/ml/pretrain/artifacts
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  postgres_data:
  qdrant_data:
