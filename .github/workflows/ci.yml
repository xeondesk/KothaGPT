name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Data + tokenizer artifact validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r services/api/requirements.txt
      - name: Build CI dataset from fixtures
        run: make ci-data-build
      - name: make data-validate
        run: make data-validate
      - name: Build CI tokenizer from fixture dataset
        run: make ci-tokenizer-build
      - name: Tokenizer artifact existence check
        run: make tokenizer-check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r services/api/requirements.txt
      - name: Run tests
        run: make test