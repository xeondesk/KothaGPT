model:
  architecture: decoder_transformer
  vocab_size: 50000
  hidden_size: 2048
  num_layers: 24
  num_heads: 16
  max_position_embeddings: 8192
  rms_norm_eps: 1e-5
  rope_theta: 500000.0
  mm_hidden: 512
  vision_encoder: true
  audio_encoder: false
  document_encoder: false
  tie_word_embeddings: true

training:
  batch_size: 2
  gradient_accumulation_steps: 16
  learning_rate: 1.0e-5
  max_steps: 1000
  warmup_steps: 100
  min_lr: 1.0e-6
  lr_schedule: cosine
  mixed_precision: bf16

data:
  train: data/processed/train
  validation: data/processed/validation
  tokenizer_path: ml/tokenizer/artifacts/best/tokenizer.json

tier:
  name: medium
  context_window: 8192
  device_profile: gpu
  quant_level: int8
  multimodal: true