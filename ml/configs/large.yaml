model:
  architecture: decoder_transformer
  vocab_size: 50000
  hidden_size: 4096
  num_layers: 32
  num_heads: 32
  max_position_embeddings: 16384
  rms_norm_eps: 1e-5
  rope_theta: 1000000.0
  rope_scaling: linear
  rope_scaling_factor: 4.0
  tie_word_embeddings: true

training:
  batch_size: 1
  gradient_accumulation_steps: 32
  learning_rate: 1.0e-4
  max_steps: 4000
  warmup_steps: 400
  min_lr: 1.0e-5
  lr_schedule: cosine
  mixed_precision: bf16

data:
  train: data/processed/train
  validation: data/processed/validation

tier:
  name: large
  context_window: 16384
  device_profile: gpu
  quant_level: int4
  cost_per_1k_tokens: 0.08
  target_latency_p95_ms: 2000
