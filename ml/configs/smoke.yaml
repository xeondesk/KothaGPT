model:
  architecture: decoder_transformer
  hidden_size: 192
  num_layers: 2
  num_heads: 4
  max_position_embeddings: 512

training:
  batch_size: 2
  gradient_accumulation_steps: 1
  learning_rate: 3.0e-4
  max_steps: 200
  warmup_steps: 20
  mixed_precision: none
  seed: 0
  eval_interval: 50
  log_interval: 10
  save_interval: 100

data:
  train: data/tokenized/CURRENT
  validation: data/tokenized/CURRENT
  tokenizer_path: ml/tokenizer/artifacts/best/tokenizer.json