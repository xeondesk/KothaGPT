[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kothagpt"
version = "0.1.0"
description = "Official Kotha GPT Python SDK"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "websockets>=13.0",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["kothagpt"]

[tool.ruff]
line-length = 100