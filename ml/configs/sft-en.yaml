model:
  architecture: decoder_transformer
  vocab_size: 698
  hidden_size: 128
  num_layers: 4
  num_heads: 4
  max_position_embeddings: 512
  rms_norm_eps: 1.0e-05
  norm_type: rmsnorm
  tie_word_embeddings: true
  rope_theta: 10000.0

training:
  batch_size: 2
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-05
  max_steps: 20
  warmup_steps: 2
  min_lr: 5.0e-06
  lr_schedule: cosine
  mixed_precision: none

data:
  train: data/processed/train
  validation: data/processed/validation
  tokenizer_path: ml/tokenizer/artifacts/best/tokenizer.json
